server.port=38077
spring.main.allow-bean-definition-overriding=true
#spring.mvc.static-path-pattern=/excleFile
spring.jackson.date-format=yyyy-MM-dd hh:mm:ss
spring.jackson.time-zone=GMT+8
spring.messages.encoding=UTF-8
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.basedir=${user.dir}/tomcatTemp 
server.tomcat.max-http-form-post-size=100MB
server.tomcat.uri-encoding=UTF-8
server.tomcat.max-threads=400
server.tomcat.max-connections=400
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

server.servlet.context-path=/flood
database.type=dm
database.dm.testsql=select 1
database.dm.keyword=[order]

#发电能力的省点号入库预测功率累加值 四川：154000
economize=154000

#dbType 2:峡江 ==特殊配置 2
type=1

#中长期定时任务开始时间  精确时：分
schedule.cronExpression=10:33

#四川 170,180,120,150,110400,130,110
#福建 10010
#hubei 2201,2202,2203,2204,2205,2206,2207,2208,2209,2210,2211
firstLevelWatershed=170,180,120,150,110400,130,110

#重大天气标识自动定时计算,定时设置到自动预报和调度之后
service.cron.saveabnormalweather.enabled=false
service.cron.saveabnormalweather.setting=0 0 10 * * *

#是否是重大天气
service.cron.saveabnormalweather.isMajor=true

#流域统计
watershedStatistics.dm=紫坪铺,亭子口,瀑布沟,二滩
watershedStatistics.river=岷江,嘉陵江,大渡河,雅砻江
watershedStatistics.basinName=长江上游流域
watershedStatistics.foreObjName=四川预报电站
watershedStatistics.weights=0.138,0.125,0.619,0.118




